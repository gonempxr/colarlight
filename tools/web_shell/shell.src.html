<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#4fb3ee">
		<title>Coralight: Dive Tycoon</title>
		<style>
@font-face { font-family: 'CL'; src: url(data:font/woff;base64,{{FONT_MAIN}}) format('woff'); font-display: block; }
@font-face { font-family: 'CLZH'; src: url(data:font/woff;base64,{{FONT_ZH}}) format('woff'); font-display: block; }

:root {
	--ink: #241a3a;
	--cream: #fff6e4;
	--gold: #ffc93c;
	--gold-dark: #e0921c;
	--sky-top: #4fb3ee;
	--sky-mid: #8fd2f7;
	--sky-bottom: #c9eeff;
	--sea-top: #35c9d2;
	--sea-mid: #1c88b6;
	--sea-deep: #165290;
	--sea-abyss: #0e2654;
	--horizon: 44%;
}

html, body, #canvas { margin: 0; padding: 0; border: 0; }

body {
	color: white;
	background-color: var(--sea-abyss);
	overflow: hidden;
	touch-action: none;
}

#canvas { display: block; }
#canvas:focus { outline: none; }

/* Loading screen */
#status {
	position: absolute;
	inset: 0;
	overflow: hidden;
	z-index: 10;
	font-family: 'CL', 'CLZH', 'Nunito', system-ui, sans-serif;
	-webkit-user-select: none;
	user-select: none;
	transition: opacity 0.6s ease;
}
#status.leaving { opacity: 0; pointer-events: none; }

.sky {
	position: absolute;
	left: 0; right: 0; top: 0;
	height: var(--horizon);
	background: linear-gradient(var(--sky-top), var(--sky-mid) 60%, var(--sky-bottom));
	overflow: hidden;
}
.rays {
	position: absolute;
	left: 50%; top: 58%;
	width: 220vmax; height: 220vmax;
	margin: -110vmax 0 0 -110vmax;
	background: repeating-conic-gradient(rgba(255, 255, 255, 0.22) 0deg 9deg, rgba(255, 255, 255, 0) 9deg 22.5deg);
	-webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.5) 18%, transparent 40%);
	mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.5) 18%, transparent 40%);
	animation: spin 60s linear infinite;
}
.cloud { position: absolute; width: clamp(90px, 16vw, 190px); animation: drift linear infinite; }
.cloud.c1 { top: 9%; animation-duration: 70s; animation-delay: -20s; }
.cloud.c2 { top: 30%; width: clamp(70px, 11vw, 140px); animation-duration: 95s; animation-delay: -70s; }
.cloud.c3 { top: 3%; width: clamp(60px, 9vw, 120px); animation-duration: 120s; animation-delay: -5s; }

.gull { position: absolute; width: clamp(22px, 3vw, 34px); animation: fly 26s linear infinite; }
.gull.g2 { animation-duration: 34s; animation-delay: -15s; top: 22%; }

.sea {
	position: absolute;
	left: 0; right: 0; bottom: 0;
	top: var(--horizon);
	background: linear-gradient(var(--sea-top), var(--sea-mid) 28%, var(--sea-deep) 62%, var(--sea-abyss));
}
.waves {
	position: absolute;
	left: 0; top: -14px;
	width: 200%; height: 30px;
	animation: waves 7s linear infinite;
}
.shine {
	position: absolute;
	inset: 0;
	background: repeating-linear-gradient(100deg, rgba(255, 255, 255, 0) 0 60px, rgba(255, 255, 255, 0.07) 60px 110px, rgba(255, 255, 255, 0) 110px 200px);
	-webkit-mask-image: linear-gradient(#000, transparent 70%);
	mask-image: linear-gradient(#000, transparent 70%);
	animation: shine 9s ease-in-out infinite alternate;
}
.bubble {
	position: absolute;
	bottom: -20px;
	border: 2px solid rgba(255, 255, 255, 0.75);
	background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.85) 0 18%, rgba(255, 255, 255, 0.12) 22%);
	border-radius: 50%;
	animation: rise linear infinite;
}
.fish { position: absolute; animation: swim linear infinite; }
/* Each fish faces the way it swims in its own SVG (the ones swimming right
   flip their art inside the SVG with a <g transform>), so no browser can
   show one swimming backwards; CSS only bobs it. */
.fish svg { display: block; width: 100%; animation: bob 1.6s ease-in-out infinite alternate; }
.fish.left { animation-name: swim-left; }

.floor {
	position: absolute;
	left: -2%; right: -2%; bottom: -2px;
	height: 8%;
	background: #e2aa62;
	border-top: 4px solid var(--ink);
	border-radius: 50% 50% 0 0 / 30% 30% 0 0;
}
.weed { position: absolute; bottom: 5%; width: clamp(34px, 5vw, 56px); transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite alternate; }

/* Foreground */
.front {
	position: absolute;
	inset: 0;
	display: grid;
	grid-template-rows: var(--horizon) 1fr;
	justify-items: center;
	padding: 0 16px;
}
.logo {
	align-self: center;
	width: min(86vw, 640px, 110vh);
	height: auto;
	margin-top: 2vh;
	filter: drop-shadow(0 6px 0 rgba(36, 26, 58, 0.25));
	animation: logo-in 0.7s cubic-bezier(0.2, 1.6, 0.4, 1) both, float 3.4s ease-in-out 0.7s infinite alternate;
}
.bottom {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: clamp(14px, 3vh, 26px);
	width: min(92vw, 480px);
	margin-top: clamp(26px, 8vh, 90px);
}
.bar {
	position: relative;
	width: 100%;
	height: clamp(26px, 4.2vh, 34px);
	box-sizing: border-box;
	border: 4px solid var(--ink);
	border-radius: 999px;
	background: #0b1d44;
	box-shadow: 0 5px 0 var(--ink), inset 0 4px 0 rgba(0, 0, 0, 0.35);
}
.fill {
	position: absolute;
	left: 0; top: 0; bottom: 0;
	width: 6%;
	min-width: 22px;
	border-radius: 999px;
	background:
		linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, 0.12)),
		repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.22) 0 10px, rgba(255, 255, 255, 0) 10px 20px),
		linear-gradient(90deg, var(--gold-dark), var(--gold));
	background-size: 100% 100%, 28px 28px, 100% 100%;
	animation: stripes 0.9s linear infinite;
	transition: width 0.35s ease-out;
}
.bar.waiting .fill { width: 30% !important; animation: stripes 0.9s linear infinite, sweep 1.6s ease-in-out infinite alternate; }
.rider {
	position: absolute;
	right: -20px; top: 50%;
	width: clamp(38px, 6vh, 48px);
	transform: translateY(-50%);
	animation: rider 1.2s ease-in-out infinite alternate;
}
.label {
	font-size: clamp(20px, 3.2vh, 28px);
	letter-spacing: 0.02em;
	text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink);
	white-space: nowrap;
}
.label .pct { color: var(--gold); margin-left: 0.3em; }
.card {
	box-sizing: border-box;
	width: 100%;
	background: var(--cream);
	color: var(--ink);
	border: 4px solid var(--ink);
	border-radius: 18px;
	box-shadow: 0 5px 0 var(--ink);
	padding: 12px 16px;
}
.tip {
	display: flex;
	align-items: center;
	gap: 12px;
	min-height: 64px;
	font-size: clamp(15px, 2.1vh, 18px);
	line-height: 1.3;
}
.tip svg { flex: none; width: 34px; }
.tip span { transition: opacity 0.35s ease; }
.tip span.fade { opacity: 0; }
#status-notice {
	display: none;
	text-align: center;
	font-size: 16px;
	line-height: 1.35;
}
#status-notice b { display: block; font-size: 20px; margin-bottom: 6px; color: #c7372f; }
#status-notice .detail { font-size: 13px; opacity: 0.75; overflow-wrap: anywhere; }
#status-notice button {
	margin-top: 12px;
	font: inherit;
	font-size: 18px;
	color: white;
	background: #5cd05f;
	border: 4px solid var(--ink);
	border-radius: 14px;
	box-shadow: 0 4px 0 var(--ink);
	padding: 8px 22px;
	cursor: pointer;
}
#status-notice button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#status.failed .bar, #status.failed .label, #status.failed .tip { display: none; }
#status.failed #status-notice { display: block; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
@keyframes fly { from { transform: translate(-10vw, 0); } 50% { transform: translate(55vw, -2vh); } to { transform: translate(115vw, 1vh); } }
@keyframes waves { to { transform: translateX(-50%); } }
@keyframes shine { to { transform: translateX(80px); } }
@keyframes rise { from { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(12px, -28vh); } 85% { opacity: 1; } to { transform: translate(-6px, -54vh); opacity: 0; } }
@keyframes swim { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
@keyframes swim-left { from { transform: translateX(120vw); } to { transform: translateX(-20vw); } }
@keyframes bob { from { transform: translateY(-3px) rotate(-3deg); } to { transform: translateY(3px) rotate(3deg); } }
@keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
@keyframes logo-in { from { transform: scale(0.6) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes float { from { transform: translateY(-4px) rotate(-1deg); } to { transform: translateY(5px) rotate(1deg); } }
@keyframes stripes { from { background-position: 0 0, 0 0, 0 0; } to { background-position: 0 0, 28px 0, 0 0; } }
@keyframes sweep { from { left: 0; } to { left: 70%; } }
@keyframes rider { from { transform: translateY(-58%) rotate(-8deg); } to { transform: translateY(-42%) rotate(8deg); } }

@media (prefers-reduced-motion: reduce) {
	#status *, #status *::before { animation: none !important; transition: none !important; }
}

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

// Frame budget, set before the engine starts:
// 1. The game draws its canvas at the screen's pixel ratio. Phones report
//    3 (some even more); 2 is sharp enough there and has 2.25 times fewer
//    pixels to fill. "Low" graphics quality in the game's settings caps it
//    at 1.5 (the game remembers the choice in localStorage). The layout
//    doesn't depend on the ratio: the game scales its UI to the window.
// 2. Screens faster than 100 Hz (120/144 Hz laptops and monitors) would
//    make the game draw twice as often for no visible gain: there the game
//    gets every 2nd screen frame (120 Hz -> 60 fps).
(function () {
	const desc = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
		Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
	let cap = 2;
	try {
		if (localStorage.getItem('coralight_quality') === 'low') {
			cap = 1.5;
		}
	} catch (e) { /* storage blocked: keep the default */ }
	window.coralightPixelCap = cap;
	if (desc && desc.get && desc.configurable !== false) {
		Object.defineProperty(window, 'devicePixelRatio', {
			configurable: true,
			get: function () {
				return Math.min(desc.get.call(window) || 1, window.coralightPixelCap || 2);
			},
		});
	}
	// Measure the screen's refresh rate while the page is still quiet;
	// only a clearly fast screen gets the frame divider.
	const nativeFrame = window.requestAnimationFrame.bind(window);
	const gaps = [];
	let prev = -1;
	const probe = function (ts) {
		if (prev >= 0) {
			gaps.push(ts - prev);
		}
		prev = ts;
		if (gaps.length < 30) {
			nativeFrame(probe);
			return;
		}
		gaps.sort((a, b) => a - b);
		const gap = gaps[gaps.length >> 1];
		if (!(gap > 1 && gap < 10)) {
			return;
		}
		// 120 Hz -> every 2nd frame, 144 Hz -> 2nd (72 fps), 240 Hz -> 4th.
		const every = Math.max(2, Math.round(16.7 / gap));
		let delivered = -1;
		window.requestAnimationFrame = function (callback) {
			let seen = 0;
			const step = function (ts) {
				seen += 1;
				// Wait for `every` screen frames, but never longer than a
				// 60 Hz frame (the screen may slow down to save power).
				if (seen < every && !(delivered >= 0 && ts - delivered >= 15)) {
					return nativeFrame(step);
				}
				delivered = ts;
				return callback(ts);
			};
			return nativeFrame(step);
		};
	};
	nativeFrame(probe);
}());

// Rewarded ads: the CrazyGames HTML5 SDK v3, only on CrazyGames (or when
// testing with ?ads=crazygames on localhost). Elsewhere (GitHub Pages,
// itch.io) nothing is loaded and the game shows no ad buttons. The game
// (Platform autoload) talks to window.coralightAds:
//   state: 'loading' | 'ready' | 'disabled' | 'failed'
//   rewarded(onStarted, onDone): onDone('ok') or onDone('error:<code>')
//   midgame(onStarted, onDone): a short break at a natural pause, same calls
//   gameplayStart(), muteAudio (the site's mute setting)
//   accounts (CrazyGames accounts work here), user (the logged-in name or ''),
//   signIn(): the CrazyGames log-in popup (CrazyGames reloads the game after
//   a log-in and keeps the Data Module progress)
(function () {
	let want = '';
	try {
		want = new URLSearchParams(window.location.search).get('ads') || '';
	} catch (e) { /* old browser: no query */ }
	// On CrazyGames itself, or embedded by CrazyGames from our own site (the
	// game page on GitHub Pages inside their iframe: the parent page is on a
	// crazygames domain), so every update of the site reaches it at once.
	const cgHost = /(^|\.)crazygames\.[a-z.]+$/i;
	let parentHost = '';
	try {
		const ao = window.location.ancestorOrigins;
		if (ao && ao.length > 0) {
			parentHost = new URL(ao[ao.length - 1]).hostname;
		} else if (window.top !== window.self && document.referrer) {
			parentHost = new URL(document.referrer).hostname;
		}
	} catch (e) { /* no parent info */ }
	const onCrazy = cgHost.test(window.location.hostname) || cgHost.test(parentHost);
	if (!onCrazy && want !== 'crazygames') {
		return;
	}
	const bridge = { state: 'loading', muteAudio: false, gameReady: false };
	window.coralightAds = bridge;
	let sdk = null;
	const safe = function (fn) {
		try {
			fn();
		} catch (e) {
			console.warn('CrazyGames SDK:', e);
		}
	};
	// The game may say "playing" before the SDK is up or before loading
	// ended: remember it and tell the SDK once both are true (in that order).
	bridge.playing = false;
	bridge.gameplayStart = function () {
		bridge.playing = true;
		if (sdk && bridge.gameReady) {
			safe(() => sdk.game.gameplayStart());
		}
	};
	bridge.loadingStop = function () {
		bridge.gameReady = true;
		if (sdk) {
			safe(() => sdk.game.loadingStop());
			if (bridge.playing) {
				safe(() => sdk.game.gameplayStart());
			}
		}

// Date (+ Age) header of a fresh request for this page, taken before the
// game starts. The game runs on it, so changing the device clock gives no
// offline earnings, daily gifts or shorter waits.
//   coralightClock.server: Unix seconds at performance.now() == at (ms)
(function () {

		const t0 = performance.now();
		let url = window.location.pathname;
		try { url += (url.indexOf('?') >= 0 ? '&' : '?') + 'clock=' + Date.now(); } catch (e) { /* keep the plain path */ }

			const t1 = performance.now();
			const d = Date.parse(r.headers.get('Date') || '');
			if (!(d > 0)) {

			}

			// The header is whole seconds: the middle of that second, half the
			// round trip later.
			c.server = d / 1000 + age + 0.5;
			c.at = (t0 + t1) / 2;
		}).catch(function () {
			if (left > 0) {
				setTimeout(function () { ask(left - 1); }, 3000);

	};

						return 'r:0:' + s;
					}
					return counted.then(function (c) { return 'r:' + (c.data().count + 1) + ':' + s; }, function () { return 'r:0:' + s; });
				});
			},
			// The leader (admins/{uid}, added by hand in the Firebase console)
			// removes a player's rows (kick) and can also ban them: bans/{uid}
			// {name, o, t}; the rules refuse scores from a banned id.
			admin: function () {
				return F.db.collection('admins').doc(me()).get().then(function (d) { return d.exists ? 'yes' : 'no'; }, function () { return 'no'; });
			},
			bans: function () {
				return F.db.collection('bans').limit(300).get().then(function (snap) {
					const list = [];
					snap.forEach(function (d) { const x = d.data(); list.push({ uid: d.id, name: String(x.name || ''), o: String(x.o || '') }); });
					return JSON.stringify({ list: list });
				});
			},
			kick: function (a) {
				const b = F.db.batch();
				(a.uids || []).slice(0, 8).forEach(function (id) {
					b.delete(F.db.collection('lb_all').doc(id));
					b.delete(weekCol(a.w).doc(id));
					b.delete(monthCol(a.m).doc(id));
					b.delete(puzzleCol(a.w).doc(id));
					if (a.l > 0) {
						b.delete(leagueCol(a.l).doc(id));
					}
					if (a.ban) {
						b.set(F.db.collection('bans').doc(id), { name: String(a.name || '').slice(0, 24), o: String(a.o || '').slice(0, 12), t: ts() });
					}
				});
				// The crown goes too when one of them holds it.
				return b.commit().then(function () {
					return crownRef().get().then(function (c) {
						if (c.exists && (a.uids || []).indexOf(String(c.data().uid)) >= 0) {
							return crownRef().delete().then(function () { return 'ok'; });
						}
						return 'ok';
					}, function () { return 'ok'; });
				});
			},
			// The leader's gift to one player: gifts/{uid} {id, coins, upto, t}
			// (only admins write it; the player reads it, applies it once
			// and deletes it).
			gift_send: function (a) {
				return F.db.collection('gifts').doc(String(a.to)).set({ id: String(a.id), coins: Number(a.coins) || 0, upto: Number(a.upto), t: ts() })
					.then(function () { return 'ok'; });
			},
			gift_get: function () {
				return F.db.collection('gifts').doc(me()).get().then(function (g) {
					if (!g.exists) {
						return 'none';
					}
					const x = g.data();
					return JSON.stringify({ id: String(x.id), coins: Number(x.coins) || 0, upto: Number(x.upto) });
				});
			},
			gift_done: function () {
				return F.db.collection('gifts').doc(me()).delete().then(function () { return 'ok'; });
			},
			// The donation board (our own site only): donors/{id} {name, total},
			// added by hand by the leader in the Firebase console.
			donors: function () {
				return F.db.collection('donors').orderBy('total', 'desc').limit(100).get().then(function (snap) {
					const list = [];
					snap.forEach(function (d) {
						const x = d.data();
						list.push({ name: String(x.name || '').slice(0, 24), total: Number(x.total) || 0 });
					});
					return JSON.stringify({ list: list });
				});
			},
			unban: function (a) {
				return F.db.collection('bans').doc(a.uid).delete().then(function () { return 'ok'; });
			},
			// Clubs: clubs/{id} {name, owner, n, t}, members clubs/{id}/m/{uid}
			// {name, s, w, t}; the weekly club board clubweeks/{w}/clubs/{id}.
			club_create: function (a) {
				return F.db.runTransaction(function (tx) {
					return tx.get(clubRef(a.id)).then(function (c) {
						if (c.exists) {
							return 'error:exists';
						}
						tx.set(clubRef(a.id), { name: a.club, owner: me(), n: 1, t: ts() });
						tx.set(memberRef(a.id), { name: a.name, s: a.s, w: a.w, t: ts() });
						tx.set(clubWeekRef(a.w, a.id), { name: a.club, s: a.s, n: 1, t: ts() });
						return 'ok';
					});
				});
			},
			club_join: function (a) {
				return F.db.runTransaction(function (tx) {
					return Promise.all([tx.get(clubRef(a.id)), tx.get(memberRef(a.id))]).then(function (r) {
						if (!r[0].exists || !(r[0].data().n > 0)) {
							return 'gone';
						}
						const name = String(r[0].data().name || '');
						if (r[1].exists) {
							return 'ok:' + name;
						}
						if (r[0].data().n >= 30) {
							return 'full';
						}
						tx.update(clubRef(a.id), { n: r[0].data().n + 1 });
						tx.set(memberRef(a.id), { name: a.name, s: a.s, w: a.w, t: ts() });
						return 'ok:' + name;
					});
				});
			},
			club_leave: function (a) {
				return F.db.runTransaction(function (tx) {
					return Promise.all([tx.get(clubRef(a.id)), tx.get(memberRef(a.id))]).then(function (r) {
						if (!r[0].exists || !r[1].exists) {
							return 'gone';
						}
						tx.update(clubRef(a.id), { n: Math.max(0, r[0].data().n - 1) });
						tx.delete(memberRef(a.id));
						return 'ok';
					});
				});
			},
			// A club with its members; a member also writes the weekly total.
			club: function (a) {
				return Promise.all([clubRef(a.id).get(), clubRef(a.id).collection('m').limit(30).get()]).then(function (r) {
					if (!r[0].exists || !(r[0].data().n > 0)) {
						return 'gone';
					}
					const c = r[0].data();
					const members = [];
					let sum = 0;
					r[1].forEach(function (d) {
						const x = d.data();
						let s = (x.w === a.w) ? (Number(x.s) || 0) : 0;
						if (d.id === me()) {
							s = a.s;
						}
						sum += s;
						members.push({ uid: d.id, name: String(x.name || ''), score: s });
					});
					if (a.mine && members.some(function (m) { return m.uid === me(); })) {
						memberRef(a.id).update({ name: a.name, s: a.s, w: a.w, t: ts() }).catch(function () {});
						clubWeekRef(a.w, a.id).set({ name: String(c.name || ''), s: sum, n: Number(c.n) || members.length, t: ts() }).catch(function () {});
					}
					return JSON.stringify({ id: a.id, name: String(c.name || ''), owner: String(c.owner || ''), members: members });
				});
			},
		};
		// Friends: who joined with my link and the friend whose link I
		// came from (their id starts with the code), on the all-time board.
		friends = function (a) {
			const ids = {};
			ids[me()] = true;
			const jobs = [];
			if (a.code) {
				jobs.push(F.db.collection('invites').doc(a.code).collection('joined').limit(25).get().then(function (s) {
					s.forEach(function (d) { ids[d.id] = true; });
				}).catch(function () {}));
			}
			if (a.ref) {
				const id = F.fb.firestore.FieldPath.documentId();
				jobs.push(F.db.collection('lb_all').where(id, '>=', a.ref).where(id, '<', a.ref + '\uf8ff').limit(1).get().then(function (s) {
					s.forEach(function (d) { ids[d.id] = true; });
				}).catch(function () {}));
			}
			return Promise.all(jobs).then(function () {
				return Promise.all(Object.keys(ids).map(function (k) {
					return F.db.collection('lb_all').doc(k).get().then(function (d) { return d.exists ? rowOf(d) : null; }, function () { return null; });
				}));
			}).then(function (list) {
				const rows = list.filter(function (r) { return r; });
				rows.sort(function (x, y) { return y.score - x.score; });
				const at = rows.findIndex(function (r) { return r.uid === me(); });
				return { rows: rows, rank: at + 1 };
			});
		};
		start = function () {
			window.coralightFirebase().then(function (f) {
				F = f;
				f.auth.onAuthStateChanged(function (u) {
					if (u) {
						setUser(u.uid);
						return;
					}
					online.state = 'loading';
					f.auth.signInAnonymously().catch(function (e) {
						console.warn('Online sign-in:', e);
						online.error = (e && e.code) || 'other';
						online.state = 'failed';
					});
				});
			}).catch(function (e) {
				console.warn('Online: Firebase failed to load:', e);
				online.state = 'failed';
			});
		};
	}
	online.submitScore = function (a) { return api.submit(a); };
	online.fetchBoard = function (a) { return api.board(a); };
	online.claimFounder = function () { return api.founder(); };
	online.registerInvite = function (code) { return api.join(code); };
	online.fetchInviteJoins = function (code) { return api.joins(code); };
	const methods = {
		submit: function (arg) { return api.submit(JSON.parse(arg)); },
		board: function (arg) { return api.board(JSON.parse(arg)).then(function (r) { return JSON.stringify(r); }); },
		founder: function () { return api.founder(); },
		join: function (arg) { return api.join(arg); },
		joins: function (arg) { return api.joins(arg); },
		claim: function (arg) { return api.claim(JSON.parse(arg)); },
		rank: function (arg) { return api.rank(JSON.parse(arg)); },
	club_create: function (arg) { return api.club_create(JSON.parse(arg)); },
	club_join: function (arg) { return api.club_join(JSON.parse(arg)); },
	club_leave: function (arg) { return api.club_leave(JSON.parse(arg)); },
	club: function (arg) { return api.club(JSON.parse(arg)); },
		admin: function () { return api.admin(); },
		crown: function () { return api.crown(); },
		crown_take: function (arg) { return api.crown_take(JSON.parse(arg)); },
		crown_fri: function (arg) { return api.crown_fri(JSON.parse(arg)); },
		gift_send: function (arg) { return api.gift_send(JSON.parse(arg)); },
		gift_get: function () { return api.gift_get(); },
		gift_done: function () { return api.gift_done(); },
		crown_tick: function (arg) { return api.crown_tick(JSON.parse(arg)); },
		kings: function (arg) { return api.kings(JSON.parse(arg)); },
		bans: function () { return api.bans(); },
		kick: function (arg) { return api.kick(JSON.parse(arg)); },
		unban: function (arg) { return api.unban(JSON.parse(arg)); },
		donors: function () { return api.donors(); },
		link: function (arg) { return linkFor(arg); },
		share: function (arg) { return online.share(JSON.parse(arg)); },
	};
	online.request = function (id, method, arg, cb) {
		let p;
		try {
			p = Promise.resolve(methods[method](String(arg || '')));
		} catch (e) {
			p = Promise.reject(e);
		}
		p.then(function (r) { cb(id, String(r)); }, function (e) {
			console.warn('Online ' + method + ':', e);
			cb(id, 'error:' + ((e && e.code) || 'other'));
		});
	};
}());

const engine = new Engine(GODOT_CONFIG);

(function () {
	const TEXT = {
		ru: {
			loading: 'Погружаемся…', starting: 'Всплываем…', failed: 'Не удалось загрузить игру', retry: 'Обновить',
			tips: [
				'Нажимай на водолазов, и они будут работать быстрее',
				'Менеджеры работают сами, даже пока тебя нет',
				'Надпись «Узкое место» подскажет, что улучшать первым',
				'Побеждай в пазле и собирай артефакты для музея',
				'Чем глубже, тем дороже сокровища',
				'Лампочка в углу всегда подскажет следующий шаг',
			],
		},
		en: {
			loading: 'Diving in…', starting: 'Surfacing…', failed: 'The game could not load', retry: 'Reload',
			tips: [
				'Tap divers to make them work faster',
				'Managers keep working even while you are away',
				'“Bottleneck” shows what to upgrade first',
				'Win puzzles to collect artifacts for the museum',
				'The deeper you dive, the richer the treasure',
				'The lightbulb always knows your next step',
			],
		},
		es: {
			loading: 'Sumergiéndonos…', starting: 'Subiendo…', failed: 'No se pudo cargar el juego', retry: 'Recargar',
			tips: [
				'Toca a los buzos para que trabajen más rápido',
				'Los gerentes siguen trabajando aunque no estés',
				'«Cuello de botella» te dice qué mejorar primero',
				'Gana puzles y reúne artefactos para el museo',
				'Cuanto más hondo, más rico el tesoro',
				'La bombilla siempre sabe tu siguiente paso',
			],
		},
		zh: {
			loading: '正在下潜…', starting: '正在上浮…', failed: '游戏加载失败', retry: '重新加载',
			tips: [
				'点击潜水员，让他们干得更快',
				'经理会一直工作，即使你不在',
				'“瓶颈”告诉你先升级什么',
				'赢得拼图，为博物馆收集文物',
				'潜得越深，宝藏越值钱',
				'灯泡总会告诉你下一步做什么',
			],
		},
	};
	const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
	let lang = 'en';
	for (const l of langs) {
		const code = String(l).toLowerCase().slice(0, 2);
		if (TEXT[code]) { lang = code; break; }
	}
	const T = TEXT[lang];
	document.documentElement.lang = lang;

	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	const statusPct = document.getElementById('status-pct');
	const statusTip = document.getElementById('status-tip');
	const statusNotice = document.getElementById('status-notice');

	statusText.textContent = T.loading;

	// Bubbles rising through the sea.
	const sea = document.getElementById('sea');
	for (let i = 0; i < 16; i++) {
		const b = document.createElement('span');
		const size = 6 + Math.random() * 16;
		b.className = 'bubble';
		b.style.width = b.style.height = size + 'px';
		b.style.left = (Math.random() * 100) + '%';
		b.style.animationDuration = (6 + Math.random() * 7) + 's';
		b.style.animationDelay = (-Math.random() * 12) + 's';
		sea.appendChild(b);
	}

	// Tips, one after another.
	let tip = Math.floor(Math.random() * T.tips.length);
	statusTip.textContent = T.tips[tip];
	const tipTimer = setInterval(() => {
		statusTip.classList.add('fade');
		setTimeout(() => {
			tip = (tip + 1) % T.tips.length;
			statusTip.textContent = T.tips[tip];
			statusTip.classList.remove('fade');
		}, 350);
	}, 4500);

	let done = false;
	function hide() {
		if (done) {
			return;
		}
		done = true;
		clearInterval(tipTimer);
		statusOverlay.classList.add('leaving');
		setTimeout(() => statusOverlay.remove(), 650);
	}

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const pct = Math.min(100, Math.floor((current / total) * 100));
			statusBar.classList.remove('waiting');
			statusFill.style.width = Math.max(6, pct) + '%';
			statusPct.textContent = pct + '%';
			statusBar.setAttribute('aria-valuenow', pct);
		} else {
			statusBar.classList.add('waiting');
			statusPct.textContent = '';
		}
	}

	function displayFailureNotice(err) {
		console.error(err);
		let detail = 'An unknown error occurred.';
		if (err instanceof Error) {
			detail = err.message;
		} else if (typeof err === 'string') {
			detail = err;
		}
		statusNotice.textContent = '';
		const title = document.createElement('b');
		title.textContent = T.failed;
		const text = document.createElement('div');
		text.className = 'detail';
		text.textContent = detail;
		const button = document.createElement('button');
		button.type = 'button';
		button.textContent = T.retry;
		button.addEventListener('click', () => window.location.reload());
		statusNotice.append(title, text, button);
		statusOverlay.classList.add('failed');
		clearInterval(tipTimer);
		done = true;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('The following features required to run the game are missing:\n' + missing.join('\n'));
		}
	} else {
		setProgress(0, 0);
		// On CrazyGames (and for a player signed in with Google) the saved
		// progress must be read before the game starts.
		const sdkWait = new Promise(function (resolve) {
			const t0 = Date.now();
			const look = function () {
				const a = window.coralightAds;
				const c = window.coralightCloud;
				const busy = (a && a.state === 'loading') || (c && c.waitStart && c.state === 'loading');
				if (!busy || Date.now() - t0 > 5000) {
					resolve();
				} else {
					setTimeout(look, 50);
				}
			};
			look();
		});
		sdkWait.then(() => engine.startGame({
			'onProgress': setProgress,
			// The game prints CORALIGHT_READY once its first screen is drawn.
			'onPrint': function (...args) {
				console.log(...args);
				if (args.join(' ').indexOf('CORALIGHT_READY') !== -1) {
					hide();
					if (window.coralightAds) {
						window.coralightAds.loadingStop();
					}
				}
			},
		}).then(() => {
			statusBar.classList.remove('waiting');
			statusFill.style.width = '100%';
			statusPct.textContent = '';
			statusText.textContent = T.starting;
			// Safety net in case the ready line never arrives.
			setTimeout(hide, 15000);
		}, displayFailureNotice));
	}
}());
		</script>
